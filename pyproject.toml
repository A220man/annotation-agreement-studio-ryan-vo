[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-agreement-studio-ryan-vo"
version = "1.0.0"
description = "NLP inter-annotator agreement studio evaluating token span and document class reliability via Cohen/Fleiss kappa and consensus reconciliation."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0"
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
